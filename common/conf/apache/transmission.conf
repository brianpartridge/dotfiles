# Serves a copy of Transmission's web UI from this repository and hands its
# RPC calls to the Transmission app, so the UI can be changed here without
# touching Transmission. See common/web/README.md.
#
# Install (macOS, once):
#   sudo cp ~/dotfiles/common/conf/apache/transmission.conf /etc/apache2/other/
#   sudo apachectl configtest && sudo apachectl graceful
#
# Apache warns "module ... is already loaded" if these are also enabled in
# httpd.conf; that is harmless.
LoadModule proxy_module libexec/apache2/mod_proxy.so
LoadModule proxy_http_module libexec/apache2/mod_proxy_http.so

# The UI itself, served straight from the checkout so edits are live.
Alias /transmission/web /Users/theater/dotfiles/common/web/transmission
<Directory "/Users/theater/dotfiles/common/web/transmission">
    Options None
    AllowOverride None
    Require all granted
</Directory>

# Same convenience redirect Transmission's own server provides.
RedirectMatch ^/transmission/?$ /transmission/web/

# The UI calls ../rpc, i.e. /transmission/rpc. Proxy that to Transmission.
# The Host header is rewritten to 127.0.0.1, which Transmission's hostname
# whitelist always accepts, so no Transmission settings need to change.
ProxyPass        /transmission/rpc http://127.0.0.1:9091/transmission/rpc
ProxyPassReverse /transmission/rpc http://127.0.0.1:9091/transmission/rpc
